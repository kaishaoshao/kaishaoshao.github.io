name: Auto Deploy Quartz Site

# Trigger on any push to feature branches (e.g., feat/quartz) or directly to main
on:
  push:
    branches:
      - 'feat/quartz'
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 02:00 运行，约合北京时间 10:00

    # You can also listen to tags if you like
    # tags:
    #   - 'v*.*.*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the entire repository (including history) so we can push back
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Set up Node.js (required for Quartz CLI)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      # Ensure npm version meets Quartz requirement
      - name: Upgrade npm
        run: npm i -g npm@10.9.2
      # Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Build the Quartz site (outputs to the "public" folder by default)
      - name: Build Quartz site
        run: npx quartz build

      # Commit the generated static site back to the main branch (or any deploy branch)
      - name: Deploy to main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Switch to main branch without losing the build output
          git checkout main
          # Ensure the build output exists
          if [ -d public ]; then
            rm -rf public || true
            cp -r public .
          else
            echo "⚠️ No 'public' folder found – skipping copy."
          fi
          git add .
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "ci: auto‑deploy Quartz build [skip ci]"
            git push origin main
          fi
